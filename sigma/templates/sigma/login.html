{% extends 'sigma/base.html' %}

{% block content %}
<style>
    body { background: linear-gradient(90deg, #5c5c5c 50%, #f4f6f9 50%); }
    .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { border-radius: 4px; border: 1px solid #ddd; max-width: 450px; width: 100%; padding: 40px; background-color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .suap-input { background-color: #fffde7; border: 1px solid #ced4da; } 
    .suap-input:focus { background-color: #fffde7; border-color: #28a745; box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25); }
    .brand-title { font-size: 3.5rem; font-weight: 300; color: #888; text-align: center; margin-bottom: 5px; }
    .brand-subtitle { font-size: 0.9rem; color: #666; text-align: center; margin-bottom: 30px; letter-spacing: 1px; }
</style>

<div class="login-container">
    <div class="login-card">
        <div class="brand-title">SIGMA</div>
        <div class="brand-subtitle">sistema de gestão de monitorias</div>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger py-2">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label text-muted small"><i class="bi bi-person-fill"></i> Usuário ou Matrícula:</label>
                <input type="text" class="form-control suap-input" id="username" name="username" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label text-muted small">Senha:</label>
                <div class="input-group">
                    <input type="password" class="form-control suap-input" id="password" name="password" required>
                    <!-- CLASSES CORRIGIDAS: Removemos o outline problemático e usamos borda padrão com fundo branco -->
                    <button class="btn border bg-white text-secondary" type="button" id="togglePassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <div class="mt-2 text-end">
                    <a href="{% url 'password_reset' %}" class="text-decoration-none small text-muted">Esqueceu a senha?</a>
                </div>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 fs-5">Acessar</button>
        </form>
    </div>
</div>

<script>
    document.getElementById('togglePassword').addEventListener('click', function () {
        const passwordInput = document.getElementById('password');
        const icon = this.querySelector('i');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash'); 
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye'); 
        }
    });
</script>
{% endblock %}
